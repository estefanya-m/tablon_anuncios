{% extends "base.html" %}
{% block content %}
<h2>Usuarios</h2>
<a href="{{ url_for('usuarios.create') }}" class="btn btn-success mb-3">Nuevo usuario</a>
<table class="table table-striped">
    <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Acciones</th></tr></thead>
    <tbody>
    {% for u in usuarios %}
    <tr>
        <td>{{ u.id }}</td><td>{{ u.nombre }}</td><td>{{ u.email }}</td>
        <td>
            <a href="{{ url_for('usuarios.edit', id=u.id) }}" class="btn btn-sm btn-warning">Editar</a>
            <form method="post" action="{{ url_for('usuarios.delete', id=u.id) }}" class="d-inline"
                  onsubmit="return confirm('¿Eliminar este usuario?')">
                <button class="btn btn-sm btn-danger">Eliminar</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
