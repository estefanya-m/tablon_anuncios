{% extends "base.html" %}
{% block content %}
<h2>Anuncios</h2>
<a href="{{ url_for('anuncios.create') }}" class="btn btn-success mb-3">Nuevo anuncio</a>
<table class="table table-striped">
    <thead><tr><th>ID</th><th>Título</th><th>Categoría</th><th>Autor</th><th>Fecha</th><th>Acciones</th></tr></thead>
    <tbody>
    {% for a in anuncios %}
    <tr>
        <td>{{ a.id }}</td><td>{{ a.titulo }}</td><td>{{ a.categoria.nombre }}</td>
        <td>{{ a.autor.nombre }}</td><td>{{ a.fecha_publicacion.strftime('%d/%m/%Y') }}</td>
        <td>
            <a href="{{ url_for('anuncios.edit', id=a.id) }}" class="btn btn-sm btn-warning">Editar</a>
            <form method="post" action="{{ url_for('anuncios.delete', id=a.id) }}" class="d-inline"
                  onsubmit="return confirm('¿Eliminar anuncio?')">
                <button class="btn btn-sm btn-danger">Eliminar</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
