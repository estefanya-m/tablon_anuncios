{% extends "base.html" %}
{% block content %}
<h2>Categorías</h2>
<a href="{{ url_for('categorias.create') }}" class="btn btn-success mb-3">Nueva categoría</a>
<table class="table table-striped">
    <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
    <tbody>
    {% for c in categorias %}
    <tr>
        <td>{{ c.id }}</td><td>{{ c.nombre }}</td><td>{{ c.descripcion }}</td>
        <td>
            <a href="{{ url_for('categorias.edit', id=c.id) }}" class="btn btn-sm btn-warning">Editar</a>
            <form method="post" action="{{ url_for('categorias.delete', id=c.id) }}" class="d-inline"
                  onsubmit="return confirm('¿Eliminar categoría y sus anuncios?')">
                <button class="btn btn-sm btn-danger">Eliminar</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
