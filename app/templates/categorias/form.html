{% extends "base.html" %}
{% block content %}
<h2>{{ 'Editar' if categoria else 'Registrar' }} categoría</h2>
<form method="post">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ categoria.nombre if categoria else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <input type="text" name="descripcion" class="form-control" value="{{ categoria.descripcion if categoria else '' }}">
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('categorias.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
